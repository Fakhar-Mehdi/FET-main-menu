<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div class="container">
    <div class='top-bar'>
      <div>
        <img src="https://muhammad-bilal18.github.io/VE-main-menu/image%201.png" alt="experios logo"
          class='top-left-logo'>
        <img src="https://noman-nawaz-cs.github.io/VE-Game-Menu/logo1.png" alt="" class='logo-2'>
      </div>
      <div class='top-buttons'>
        <button class='top-bar-button'>
          <img src="./switch.png" alt="" class='button-icon'>
          6 connected
        </button>

        <button class='top-bar-button'>
          <img src="./logout.png" alt="" class='button-icon'>
          log out
        </button>
      </div>
    </div>

    <main class="main">
      <div class="front-text">
        <h6 class='heading-top'>Experios presents</h6>
        <h2 class='heading'> BLACKEYE'S TREASURE </h2>
      </div>

      <div class="cards">
        <div class="card">
          <img src="https://haidersaleem-official.github.io/VE-MainMenu-Responsive/card4_logo.png" alt=""
            class='card-logo'>
          <h4 class='card-title'>our games</h4>
        </div>
        <div class="card">
          <img src="https://haidersaleem-official.github.io/VE-MainMenu-Responsive/card4_logo.png" alt=""
            class='card-logo'>
          <h4 class='card-title'>leaderboard</h4>

        </div>
        <div class="card">
          <img src="https://haidersaleem-official.github.io/VE-MainMenu-Responsive/card4_logo.png" alt=""
            class='card-logo'>
          <h4 class='card-title'>how to play</h4>

        </div>
        <div class="card">
          <img src="https://haidersaleem-official.github.io/VE-MainMenu-Responsive/card4_logo.png" alt=""
            class='card-logo'>
          <h4 class='card-title'>get started</h4>

        </div>
      </div>
    </main>
  </div>

</body>

</html>
